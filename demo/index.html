<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baffle live demo</title>
<meta name="description" content="Sign in to the Baffle live demo.">
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --line: #cbd5e1;
          --accent: #0f766e; --accent-text: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1519; --card: #13232a; --text: #e2e8f0; --muted: #94a3b8; --line: #27424c;
            --accent: #2dd4bf; --accent-text: #0b1519; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  p { margin: 0 0 16px; color: var(--muted); }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: var(--accent);
          color: var(--accent-text); font-weight: 600; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .small { margin: 20px 0 0; font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <h1>Baffle live demo</h1>
  <p>Sign in with your email address and the code from your email.</p>
  <a class="btn" href="https://baffle-demo.duckdns.org/p/">Go to the live demo</a>
  <p class="small">Bookmark the demo once you are there. Codes work once.</p>
</main>
</body>
</html>
